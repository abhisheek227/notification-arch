<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Service — Level 3 (SSE)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Toast Container -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-title">
                <h1>Notifications</h1>
                <span id="unread-count" class="badge">0</span>
                <span id="sse-status" class="status-pill">Connecting...</span>
            </div>
            <div class="header-actions">
                <button id="mark-all-read-btn" class="btn btn-secondary" type="button">Mark all read</button>
                <button id="clear-all-btn" class="btn btn-danger-outline" type="button">Clear all</button>
            </div>
        </header>

        <!-- Main Layout -->
        <main class="main-grid">
            <!-- Left: Trigger Backend SSE -->
            <section class="panel" aria-labelledby="trigger-heading">
                <h2 id="trigger-heading" class="panel-title">Push via Backend</h2>
                <form id="notify-form" class="form">
                    <div class="form-group">
                        <label for="notif-title">Title</label>
                        <input id="notif-title" type="text" placeholder="e.g. Build Complete" required>
                    </div>

                    <div class="form-group">
                        <label for="notif-message">Message</label>
                        <textarea id="notif-message" rows="3" placeholder="Notification payload..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="notif-type">Type</label>
                        <select id="notif-type">
                            <option value="info">Info</option>
                            <option value="success">Success</option>
                            <option value="warning">Warning</option>
                            <option value="error">Error</option>
                        </select>
                    </div>

                    <button id="send-btn" class="btn btn-primary" type="submit">Send to SSE Stream</button>
                </form>
            </section>

            <!-- Right: Live SSE Notification Feed -->
            <section class="panel" aria-labelledby="feed-heading">
                <div class="feed-header">
                    <h2 id="feed-heading" class="panel-title">Live Feed</h2>
                    <div class="filter-bar" role="tablist" aria-label="Filter notifications">
                        <button class="filter-btn active" data-filter="all" type="button">All</button>
                        <button class="filter-btn" data-filter="unread" type="button">Unread</button>
                        <button class="filter-btn" data-filter="info" type="button">Info</button>
                        <button class="filter-btn" data-filter="success" type="button">Success</button>
                        <button class="filter-btn" data-filter="warning" type="button">Warning</button>
                        <button class="filter-btn" data-filter="error" type="button">Error</button>
                    </div>
                </div>

                <ul id="notification-list" class="notification-list"></ul>

                <div id="empty-state" class="empty-state">
                    <p>Listening for SSE events on <code>/events</code>...</p>
                </div>
            </section>
        </main>
    </div>

    <script src="src.js"></script>
</body>
</html>
